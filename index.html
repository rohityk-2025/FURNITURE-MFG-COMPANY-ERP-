const TagBadge = ({ tag }) => {
  const colors = { 'Bestseller': '#C4963A', 'New': '#4A3728', 'Limited': '#8B4040', 'Hot': '#C4963A', 'Premium': '#4A3728' };
  return tag ? (
    <span style={{ position:'absolute', top:12, right:12, background: colors[tag]||'#4A3728', color:'#fff', fontSize:10, fontWeight:600, letterSpacing:1.5, padding:'4px 10px', textTransform:'uppercase' }}>
      {tag}
    </span>
  ) : null;
};

const WishlistBtn = ({ liked, onToggle }) => (

const ProductCard = ({ product, onClick }) => {
  const [liked, setLiked] = useState(false);
  return (
    <div onClick={() => onClick(product)} style={{ cursor:'pointer', background:'#fff', border:'1px solid #EDE8E3', overflow:'hidden', transition:'transform 0.3s, box-shadow 0.3s', position:'relative' }}
      onMouseEnter={e => { e.currentTarget.style.transform='translateY(-4px)'; e.currentTarget.style.boxShadow='0 12px 40px rgba(44,36,32,0.12)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='none'; }}>
      <div style={{ position:'relative', overflow:'hidden', height:240 }}>
        <img src={product.images[0]} alt={product.name} style={{ width:'100%', height:'100%', objectFit:'cover', transition:'transform 0.5s' }}
          onMouseEnter={e => e.currentTarget.style.transform='scale(1.05)'}
          onMouseLeave={e => e.currentTarget.style.transform='scale(1)'}/>
        <TagBadge tag={product.tag} />
        <WishlistBtn liked={liked} onToggle={() => setLiked(l => !l)} />
      </div>
      <div style={{ padding:'16px 20px 20px' }}>
        <p style={{ fontSize:11, color:'#8B6F52', letterSpacing:2, textTransform:'uppercase', marginBottom:6 }}>{product.material}</p>
        <h3 style={{ fontFamily:'Cormorant Garamond', fontSize:20, fontWeight:600, marginBottom:10, color:'#2C2420' }}>{product.name}</h3>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <span style={{ fontFamily:'Jost', fontWeight:600, fontSize:18, color:'#2C2420' }}>₹{product.price.toLocaleString()}</span>

          <span style={{ fontSize:11, fontWeight:600, color:'#C4963A', background:'#FDF6E8', padding:'3px 8px', borderRadius:2 }}>{product.discount}% OFF</span>
        </div>
      </div>
    </div>
  );
};

/* ─── NAVBAR ─── */
const Navbar = ({ page, setPage, cartCount }) => {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:1000, background: scrolled ? 'rgba(253,250,247,0.97)' : 'transparent', backdropFilter: scrolled ? 'blur(12px)' : 'none', borderBottom: scrolled ? '1px solid #EDE8E3' : 'none', transition:'all 0.4s', padding:'0 48px', height:72, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <button onClick={() => setPage('home')} style={{ fontFamily:'Cormorant Garamond', fontSize:26, fontWeight:600, color:'#2C2420', letterSpacing:2 }}>
        ☀ SUNSHINE
      </button>
      <div style={{ display:'flex', gap:36, alignItems:'center' }}>
        {['Products','About','Contact'].map(n => (
          <button key={n} onClick={() => setPage(n.toLowerCase())} style={{ fontSize:12, letterSpacing:2, textTransform:'uppercase', color:'#4A3728', fontWeight:500, transition:'color 0.2s' }}
            onMouseEnter={e => e.currentTarget.style.color='#C4963A'}
            onMouseLeave={e => e.currentTarget.style.color='#4A3728'}>
            {n}
          </button>
        ))}
        <button onClick={() => setPage('cart')} style={{ position:'relative', fontSize:13, letterSpacing:2, textTransform:'uppercase', color:'#4A3728', fontWeight:500 }}>
          Cart {cartCount > 0 && <span style={{ position:'absolute', top:-8, right:-10, background:'#C4963A', color:'#fff', borderRadius:'50%', width:18, height:18, fontSize:10, display:'flex', alignItems:'center', justifyContent:'center' }}>{cartCount}</span>}

          onMouseLeave={e => e.currentTarget.style.background='#2C2420'}>
          Login
        </button>
      </div>
    </nav>
  );
};

/* ─── MAIN APP ─── */
const ERP_API = 'http://localhost:5000/api/website/public';

const App = () => {
  const [page, setPage] = useState('home');
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [cart, setCart] = useState([]);
  const [, forceUpdate] = useState(0);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [page]);

  // Fetch live data from ERP backend
  useEffect(() => {
    fetch(ERP_API)
      .then(r => r.json())
      .then(data => {
        const FALLBACK_IMG = 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80';
        if (data.products && data.products.length > 0) {
          PRODUCTS = data.products.map(p => {
            let imgs = [];
            try { imgs = typeof p.image_urls === 'string' ? JSON.parse(p.image_urls) : (p.image_urls || []); } catch { imgs = []; }
            if (!imgs.length) imgs = [FALLBACK_IMG];
            const orig = parseFloat(p.original_price) || 0;
            const price = parseFloat(p.price) || 0;
            const discount = orig > price ? Math.round(((orig - price) / orig) * 100) : 0;
            return {
              id: p.id, name: p.title,
              category: (p.category || '').toLowerCase().replace(/\s+/g, ''),
              price, originalPrice: orig || price, discount,
              tag: p.tag || null, material: p.material || '',
              brand: p.brand || 'Sunshine', weight: p.weight || '',
              dimensions: p.dimensions || '', roomType: p.room_type || '',
              description: p.description || '', images: imgs,
            };
          });
        }
        if (data.deals && data.deals.length > 0) {
          ADS = data.deals.map(d => ({
            title: d.title, subtitle: d.subtitle || '',
            cta: d.cta_text || 'Shop Now',
            bg: d.bg_color || '#2C2420', color: d.text_color || '#E8C97A',
          }));
        }
        forceUpdate(v => v + 1);
      })
      .catch(() => {}); // silently fall back to hardcoded data
  }, []);

  const handleSetPage = (p) => setPage(p);
  const handleSetCategory = (c) => { setSelectedCategory(c); };
  const handleSetProduct = (p) => { setSelectedProduct(p); };

  if (page === 'login') return <LoginPage setPage={handleSetPage} />;

  return (
    <div>
      {page !== 'login' && <Navbar page={page} setPage={handleSetPage} cartCount={cart.length} />}
      {page === 'home' && <HomePage setPage={handleSetPage} setSelectedCategory={handleSetCategory} setSelectedProduct={handleSetProduct} />}
      {page === 'products' && <ProductsPage setPage={handleSetPage} setSelectedProduct={handleSetProduct} setSelectedCategory={handleSetCategory} />}
      {page === 'category' && <CategoryPage setPage={handleSetPage} setSelectedProduct={handleSetProduct} selectedCategory={selectedCategory} />}
      {page === 'product' && selectedProduct && <ProductPage setPage={handleSetPage} selectedProduct={selectedProduct} setCart={setCart} cart={cart} />}
      {page === 'about' && <AboutPage setPage={handleSetPage} />}
      {page === 'contact' && <ContactPage setPage={handleSetPage} />}
      {page === 'cart' && <CartPage setPage={handleSetPage} cart={cart} setCart={setCart} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
